<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <style>
    :root { color-scheme: light dark; }
    .trace { stroke: #1d1d1f; }
    .pad { fill: #0071e3; }
    @media (prefers-color-scheme: dark) {
      .trace { stroke: #f5f5f7; }
      .pad { fill: #2997ff; }
    }
  </style>
  <!-- A via and two routed traces: the smallest honest mark for a PCB engineer. -->
  <g class="trace" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 8h9l5 5h10" />
    <path d="M4 24h9l5-5" />
  </g>
  <circle class="pad" cx="18" cy="13" r="3.2" />
</svg>
