name: Deploy to Cloudflare

on:
  push:
    branches: ['**']
  workflow_dispatch:

# Only what wrangler needs. The Pages flow required `pages: write` and
# `id-token: write` for OIDC; neither applies now — Cloudflare authenticates
# with an API token from repository secrets.
permissions:
  contents: read

# Per branch, not one global group. The old `group: pages` was right when there
# was a single published site and a second deploy would fight the first; now a
# preview build on one branch has nothing to do with a production build on
# another, and serialising them would only make previews slow.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Astro 7 requires >= 22.12.
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      # Pinned to the version the layout was proofed against. Typst's own
      # renderer changes between releases, and this PDF is a document someone
      # applies for a job with — it should not shift under it.
      #
      # This step, and the two below it, are why the site is built here and
      # uploaded rather than built by Cloudflare from the repository. Cloudflare
      # would have meant reproducing the version pin and the font assertion
      # inside its build image, which is duplicating a CI that already works to
      # gain nothing.
      - name: Set up Typst
        uses: typst-community/setup-typst@v5
        with:
          typst-version: 0.15.1

      # Must run before the Astro build: it writes into public/, which Astro
      # copies into dist/ as part of that build.
      #
      # The font check is not paranoia. Typst treats an unresolvable family as a
      # warning and silently falls back, so a missing package would produce a
      # perfectly valid PDF set in the wrong typeface rather than a failed build.
      - name: Build résumé PDF
        run: |
          test -s node_modules/@expo-google-fonts/noto-sans/400Regular/NotoSans_400Regular.ttf \
            || { echo "::error::Noto Sans TTFs missing — the résumé would silently fall back to a serif"; exit 1; }
          npm run resume

      - name: Build
        run: npm run build

      # The site links to /resume.pdf unconditionally once site.resumeReady is
      # on, so a missing PDF is a broken download button on a live page.
      - name: Verify the résumé made it into the build
        run: |
          test -s dist/resume.pdf || { echo "::error::dist/resume.pdf missing or empty"; exit 1; }
          echo "resume.pdf -> $(stat -c%s dist/resume.pdf) bytes"

      # `_headers` is the whole reason for moving off GitHub Pages, and it
      # reaches the deployment only by being copied out of public/ by the Astro
      # build. If that ever stops happening the site keeps working and silently
      # loses a year of caching on 7 MB of assets — which is exactly the kind of
      # regression nobody notices, so it is asserted rather than trusted.
      - name: Verify the cache headers made it into the build
        run: |
          test -s dist/_headers || { echo "::error::dist/_headers missing"; exit 1; }
          grep -q 'immutable' dist/_headers \
            || { echo "::error::dist/_headers has no immutable rule"; exit 1; }
          echo "_headers -> $(grep -c '^/' dist/_headers) path blocks"

      # main is production and lands on the custom domain; every other branch
      # uploads a version and gets its own preview URL, which is what makes it
      # possible to look at an unmerged redesign on a real host before it is
      # merged. `wrangler deploy` on a branch would publish it to the live site,
      # so the two are deliberately different commands rather than one command
      # with a flag.
      # `wranglerVersion` must equal the `wrangler` pin in package.json. The
      # action installs its own copy and defaults to latest, so without this the
      # deploy tool would float while every other tool in this pipeline is
      # pinned — Node, Typst, the fonts. package.json is the source of truth;
      # change it there first and copy the version to both steps below.
      - name: Deploy to production
        if: github.ref == 'refs/heads/main'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.127.1'
          command: deploy

      - name: Upload preview version
        if: github.ref != 'refs/heads/main'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.127.1'
          command: versions upload
