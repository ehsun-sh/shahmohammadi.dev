name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Required by the official Pages flow: `deploy-pages` authenticates with OIDC
# rather than a token, so `id-token: write` is not optional.
permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Astro 7 requires >= 22.12.
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      # Pinned to the version the layout was proofed against. Typst's own
      # renderer changes between releases, and this PDF is a document someone
      # applies for a job with — it should not shift under it.
      - name: Set up Typst
        uses: typst-community/setup-typst@v5
        with:
          typst-version: 0.15.1

      # Must run before the Astro build: it writes into public/, which Astro
      # copies into dist/ as part of that build.
      #
      # The font check is not paranoia. Typst treats an unresolvable family as a
      # warning and silently falls back, so a missing package would produce a
      # perfectly valid PDF set in the wrong typeface rather than a failed build.
      - name: Build résumé PDF
        run: |
          test -s node_modules/@expo-google-fonts/open-sans/400Regular/OpenSans_400Regular.ttf \
            || { echo "::error::Open Sans TTFs missing — the résumé would silently fall back to a serif"; exit 1; }
          npm run resume

      # Pages has to be enabled on the repo before this step can succeed, and it
      # cannot enable itself: `enablement: true` was tried here and the default
      # GITHUB_TOKEN is refused with "Resource not accessible by integration",
      # because creating a Pages site needs repo-admin rights the workflow token
      # does not carry. It is a one-time setup step done with a real account —
      # Settings → Pages → Source: GitHub Actions, which only appears once the
      # repo has a branch, or `gh api -X POST repos/OWNER/REPO/pages -f
      # build_type=workflow` before the first push. See Docs/DEPLOY.md.
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build
        run: npm run build

      # public/CNAME is copied into dist by the build, which is what keeps the
      # custom domain attached across deploys. If this ever fails, the domain
      # silently detaches — hence the explicit check rather than trust.
      - name: Verify custom domain survived the build
        run: |
          test -f dist/CNAME || { echo "::error::dist/CNAME missing"; exit 1; }
          echo "CNAME -> $(cat dist/CNAME)"

      # The site links to /resume.pdf unconditionally once site.resumeReady is
      # on, so a missing PDF is a broken download button on a live page.
      - name: Verify the résumé made it into the build
        run: |
          test -s dist/resume.pdf || { echo "::error::dist/resume.pdf missing or empty"; exit 1; }
          echo "resume.pdf -> $(stat -c%s dist/resume.pdf) bytes"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
