<!--
  ESM monogram. The one copy of this artwork in the repo.

  Two deliberate differences from the CorelDRAW export in images/Logo.svg:
  the white hexagon plate and the empty bounding rect are gone, and the mark
  fills with `currentColor`. The plate was never visible — the dark monogram
  covers it completely — but it turned the counters white, which pinned the
  mark to a light background. Dropping it makes the counters real holes, so
  the mark reads on any surface and follows the theme instead of fighting it.

  Consumers: src/components/BrandMark.astro (inlined), scripts/make-icons.mjs
  (rasterised to the favicon set), src/lib/og.ts (social cards).
-->
